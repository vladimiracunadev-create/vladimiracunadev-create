name: Coherencia

on:
  push:
    branches: [main]
    paths: ["**.md", "scripts/check_coherence.py", ".github/workflows/coherence.yml"]
  pull_request:
    paths: ["**.md", "scripts/check_coherence.py"]

permissions:
  contents: read

jobs:
  coherencia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 -I -X utf8 scripts/check_coherence.py
