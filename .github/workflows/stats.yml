name: Estadísticas del perfil

# Mantiene al día las cifras del README y las escribe como insignias estáticas
# entre los marcadores STATS.
#
# Se evitan a propósito las insignias `dynamic/json` de Shields.io apuntando a
# api.github.com: obligan a Shields a consultar esa API en cada petición, y su
# límite sin autenticar (60/hora por IP, compartido entre todos sus usuarios) se
# agota. Cuando eso pasa, la insignia renderiza «invalid» en el perfil. Aquí la
# consulta la hace el runner con su propio token y el resultado queda escrito.
#
# Excepción: las insignias NATIVAS de Shields —`github/stars/:usuario` y
# `github/followers/:usuario`— sí se usan, y viven en el README FUERA de los
# marcadores STATS. No son `dynamic/json`: Shields las resuelve con su propio
# pool de tokens autenticados, así que no dependen del límite anónimo y se
# actualizan solas en cada visita. Este workflow no las toca.
#
# Los forks no tienen insignia nativa a nivel de usuario (Shields solo ofrece
# `github/forks/:usuario/:repo`, por repositorio), así que el total se cuenta
# aquí y se escribe como insignia estática, igual que el resto del bloque.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: perfil-stats
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Contar releases y lenguajes
        id: contar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USUARIO: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          # Solo repositorios públicos y propios: los forks no son obra propia.
          gh api "users/$USUARIO/repos?type=owner&per_page=100" --paginate \
            --jq '.[] | select(.private == false and .fork == false) | "\(.name)\t\(.language // "")"' > repos.tsv

          repos=$(wc -l < repos.tsv)
          lenguajes=$(cut -f2 repos.tsv | grep -v '^$' | sort -u | wc -l)

          # Clases de los currículos. Los programas no comparten una única
          # convención de carpetas, así que contar un solo patrón deja fuera
          # programas enteros: hasta el 19-08-2026 se contaban 1931 clases de
          # las 3463 reales porque solo se reconocía el patrón 1.
          #
          # Patrones que existen hoy en los repositorios:
          #   1. classes|clases/<parte>/<NNN>-<slug>        (carpeta)
          #   2. modules/<NN>-<slug>/classes/<NNN>-<slug>   (carpeta)
          #   3. curriculum/part-<NN>.../class-<NN>...      (carpeta)
          #   4. los patrones 2 y 3 cuando la clase es un .md, no una carpeta
          #   5. curriculum/<NN>-<slug>/clase-<NN>-<slug>.md
          #   6. Machine Operator: 11 documentos-clase por cada uno de 41 cursos
          #   7. Neural Network Labs: labs 00-24 + advanced_labs 25-30
          #   8. Arquitectura: classes/parte-<NN>/ARQ-<NNN>.md
          #   9. Programa escolar chileno: cifra de clases declarada en la
          #      descripción pública del repo, porque el árbol mezcla OA,
          #      páginas HTML y clases desarrolladas.
          #  10. Ingeniería de software: classes/part-<NN>-.../se-<NNN>-...
          #
          # Se exige la ruta completa: anclar solo al inicio contaría además
          # cada subcarpeta interna de la clase. Cada entrada del árbol se
          # evalúa una sola vez, así que ningún patrón la cuenta dos veces.
          clases=0
          while IFS=$'\t' read -r nombre _; do
            if [[ "$nombre" == "machine-operator-program" ]]; then
              n=$(gh api "repos/$USUARIO/$nombre/git/trees/HEAD?recursive=1" \
                    --jq '[.tree[] | select(
                             .type == "blob"
                             and (.path | endswith(".md"))
                             and (.path | test("^(vehiculos|vehiculos-fantasticos)/[^/]+/(historia/[^/]+|operacion/(caracteristicas|sistemas-mecanicos|principios|entornos)-[^/]+|modelos/[^/]+|mandos/[^/]+|reglamentos/[^/]+|simulacion/[^/]+|recursos/[^/]+|ejercicios/[^/]+)$"))
                           )] | length' \
                  2>/dev/null || echo 0)
            elif [[ "$nombre" == "neural-network-training-labs" ]]; then
              n=$(gh api "repos/$USUARIO/$nombre/git/trees/HEAD?recursive=1" \
                    --jq '[.tree[] | select(
                             .type == "tree"
                             and (.path | test("^(labs|advanced_labs)/[0-9]{2}_[^/]+$"))
                           )] | length' \
                  2>/dev/null || echo 0)
            elif [[ "$nombre" == "architecture-built-environment-learning-program" ]]; then
              n=$(gh api "repos/$USUARIO/$nombre/git/trees/HEAD?recursive=1" \
                    --jq '[.tree[] | select(
                             .type == "blob"
                             and (.path | test("^classes/parte-[0-9]+/ARQ-[0-9]{3}\\.md$"))
                           )] | length' \
                  2>/dev/null || echo 0)
            elif [[ "$nombre" == "chilean-school-learning-path" ]]; then
              n=$(gh api "repos/$USUARIO/$nombre" \
                    --jq 'try ((.description // "") | capture("(?<n>[0-9][0-9.]*) clases").n | gsub("\\."; "")) catch "0"' \
                  2>/dev/null || echo 0)
            elif [[ "$nombre" == "software-engineering-learning-suite" ]]; then
              n=$(gh api "repos/$USUARIO/$nombre/git/trees/HEAD?recursive=1" \
                    --jq '[.tree[] | select(
                             .type == "tree"
                             and (.path | test("^classes/part-[^/]+/se-[0-9]{3}-[^/]+$"))
                           )] | length' \
                  2>/dev/null || echo 0)
            else
              n=$(gh api "repos/$USUARIO/$nombre/git/trees/HEAD?recursive=1" \
                    --jq '[.tree[] | select(
                             (.type == "tree" and (.path | test("^(classes|clases)/[^/]+/[0-9]{3}-[^/]+$")))
                             or (.type == "tree" and (.path | test("^modules/[0-9]+-[^/]+/classes/[0-9]{3}-[^/]+$")))
                             or (.type == "tree" and (.path | test("^curriculum/part-[0-9]+[^/]*/class-[0-9]+[^/]*$")))
                             or (.type == "blob" and (.path | endswith(".md")) and (.path | test("^modules/[0-9]+-[^/]+/classes/[0-9]+-[^/]+$")))
                             or (.type == "blob" and (.path | endswith(".md")) and (.path | test("^curriculum/part-[0-9]+[^/]*/class-[0-9]+[^/]*$")))
                             or (.type == "blob" and (.path | endswith(".md")) and (.path | test("^curriculum/[0-9]+-[^/]+/clase-[0-9]+-[^/]+$")))
                           )] | length' \
                  2>/dev/null || echo 0)
            fi
            clases=$((clases + ${n:-0}))
          done < repos.tsv

          # `--paginate` emite un `length` por página: se suman con awk para no
          # depender de `bc`, que no está garantizado en el runner.
          releases=0
          while IFS=$'\t' read -r nombre _; do
            n=$(gh api "repos/$USUARIO/$nombre/releases?per_page=100" --paginate --jq 'length' 2>/dev/null \
                | awk '{s += $1} END {print s + 0}')
            releases=$((releases + ${n:-0}))
          done < repos.tsv

          # Forks recibidos sobre obra propia. Se suman con awk por lo mismo que
          # los releases: `bc` no está garantizado en el runner.
          forks=$(gh api "users/$USUARIO/repos?type=owner&per_page=100" --paginate \
                    --jq '.[] | select(.private == false and .fork == false) | .forks_count' \
                  | awk '{s += $1} END {print s + 0}')

          echo "repos=$repos"         >> "$GITHUB_OUTPUT"
          echo "lenguajes=$lenguajes" >> "$GITHUB_OUTPUT"
          echo "releases=$releases"   >> "$GITHUB_OUTPUT"
          echo "clases=$clases"       >> "$GITHUB_OUTPUT"
          echo "forks=$forks"         >> "$GITHUB_OUTPUT"
          echo "Repos: $repos · Releases: $releases · Lenguajes: $lenguajes · Clases: $clases · Forks: $forks"

      - name: Reescribir el bloque del README
        env:
          USUARIO: ${{ github.repository_owner }}
          REPOS: ${{ steps.contar.outputs.repos }}
          RELEASES: ${{ steps.contar.outputs.releases }}
          LENGUAJES: ${{ steps.contar.outputs.lenguajes }}
          CLASES: ${{ steps.contar.outputs.clases }}
          FORKS: ${{ steps.contar.outputs.forks }}
        run: |
          python - <<'PY'
          import os, re

          usuario = os.environ["USUARIO"]
          repos = os.environ["REPOS"]
          releases = os.environ["RELEASES"]
          lenguajes = os.environ["LENGUAJES"]
          clases = os.environ["CLASES"]
          forks = os.environ["FORKS"]

          perfiles = {
              "README.md": [
                  ("Repos públicos", "repos%20p%C3%BAblicos", repos, "7c5cff", "github", f"https://github.com/{usuario}?tab=repositories"),
                  ("Releases publicadas", "releases%20publicadas", releases, "f39c12", "github", f"https://github.com/{usuario}?tab=repositories"),
                  ("Lenguajes", "lenguajes%20principales", lenguajes, "0366d6", "", "#-el-ecosistema-de-un-vistazo"),
                  ("Clases", "clases%20de%20curr%C3%ADculo", clases, "3fb950", "", "#-currículos-técnicos-completos"),
              ],
              "README.en.md": [
                  ("Public repos", "public%20repos", repos, "7c5cff", "github", f"https://github.com/{usuario}?tab=repositories"),
                  ("Published releases", "published%20releases", releases, "f39c12", "github", f"https://github.com/{usuario}?tab=repositories"),
                  ("Languages", "main%20languages", lenguajes, "0366d6", "", "#-ecosystem-at-a-glance"),
                  ("Classes", "curriculum%20classes", clases, "3fb950", "", "#-complete-technical-curricula"),
              ],
              "README.pt.md": [
                  ("Repositórios públicos", "reposit%C3%B3rios%20p%C3%BAblicos", repos, "7c5cff", "github", f"https://github.com/{usuario}?tab=repositories"),
                  ("Releases publicadas", "releases%20publicadas", releases, "f39c12", "github", f"https://github.com/{usuario}?tab=repositories"),
                  ("Linguagens", "linguagens%20principais", lenguajes, "0366d6", "", "#-ecossistema-em-uma-visão"),
                  ("Aulas", "aulas%20de%20curr%C3%ADculo", clases, "3fb950", "", "#-currículos-técnicos-completos"),
              ],
              "README.it.md": [
                  ("Repository pubblici", "repository%20pubblici", repos, "7c5cff", "github", f"https://github.com/{usuario}?tab=repositories"),
                  ("Release pubblicate", "release%20pubblicate", releases, "f39c12", "github", f"https://github.com/{usuario}?tab=repositories"),
                  ("Linguaggi", "linguaggi%20principali", lenguajes, "0366d6", "", "#-ecosistema-in-sintesi"),
                  ("Classi", "classi%20curricolari", clases, "3fb950", "", "#-curricula-tecnici-completi"),
              ],
              "README.fr.md": [
                  ("Dépôts publics", "d%C3%A9p%C3%B4ts%20publics", repos, "7c5cff", "github", f"https://github.com/{usuario}?tab=repositories"),
                  ("Releases publiées", "releases%20publi%C3%A9es", releases, "f39c12", "github", f"https://github.com/{usuario}?tab=repositories"),
                  ("Langages", "langages%20principaux", lenguajes, "0366d6", "", "#-lécosystème-en-un-coup-dœil"),
                  ("Classes", "classes%20de%20cursus", clases, "3fb950", "", "#-cursus-techniques-complets"),
              ],
              "README.zh.md": [
                  ("公共仓库", "public%20repos", repos, "7c5cff", "github", f"https://github.com/{usuario}?tab=repositories"),
                  ("已发布版本", "published%20releases", releases, "f39c12", "github", f"https://github.com/{usuario}?tab=repositories"),
                  ("主要语言", "main%20languages", lenguajes, "0366d6", "", "#-生态系统概览"),
                  ("课程数", "curriculum%20classes", clases, "3fb950", "", "#-完整技术课程"),
              ],
          }

          hubo_cambios = False
          for ruta, filas in perfiles.items():
              bloque = ["<!-- STATS:START -->"]
              for alt, label, valor, color, logo, href in filas:
                  logo_qs = f"&logo={logo}" if logo else ""
                  bloque.append(
                      f"[![{alt}](https://img.shields.io/badge/{label}-{valor}-{color}"
                      f"?style=for-the-badge{logo_qs})]({href})"
                  )
              bloque.append(f"[![Forks](https://img.shields.io/badge/forks-{forks}-8957e5?style=for-the-badge&logo=github)](https://github.com/{usuario}?tab=repositories)")
              bloque.append("<!-- STATS:END -->")
              bloque = "\n".join(bloque)

              readme = open(ruta, encoding="utf-8").read()
              nuevo = re.sub(r"<!-- STATS:START -->.*?<!-- STATS:END -->", lambda _: bloque, readme, flags=re.S)
              if nuevo != readme:
                  open(ruta, "w", encoding="utf-8").write(nuevo)
                  hubo_cambios = True
                  print(f"{ruta} actualizado.")

          if not hubo_cambios:
              print("Sin cambios en las cifras.")
          PY

      - name: Publicar si cambió
        run: |
          if git diff --quiet README.md README.en.md README.pt.md README.it.md README.fr.md README.zh.md; then
            echo "Las cifras no variaron; no hay nada que publicar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.en.md README.pt.md README.it.md README.fr.md README.zh.md
          git commit -m "chore: actualiza las estadísticas del perfil"
          git push
